# 这是部署示例，不会由插件自动安装。把占位符替换为专用、仅 plugin scope
# 的 AstrBot API Key，并把 upstream 改成代理容器实际可达的 AstrBot 25520 地址。

limit_req_zone $binary_remote_addr zone=quest_pairing:10m rate=6r/m;

server {
    listen 8520;
    server_name 192.168.50.10;

    client_max_body_size 64k;

    # 首次绑定的唯一特殊入口。必须位于普通代理 location 之前。
    location = /api/v1/plugins/extensions/astrbot_plugin_embodiment_bridge/pairing/exchange {
        limit_except POST { deny all; }
        limit_req zone=quest_pairing burst=3 nodelay;
        client_max_body_size 16k;

        # 覆盖客户端伪造值，不要把客户端 Authorization 透传到这里。
        proxy_set_header Authorization "ApiKey REPLACE_WITH_DEDICATED_PLUGIN_SCOPE_API_KEY";
        proxy_set_header X-Quest-Pairing-Source $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Host $host;
        proxy_request_buffering on;

        proxy_pass http://127.0.0.1:25520/api/v1/plugins/extensions/astrbot_plugin_embodiment_bridge/pairing/exchange;
    }

    # 配对后 health/session/SSE/turn 等请求携带 Quest 自己的两层认证。
    location /api/v1/plugins/extensions/astrbot_plugin_embodiment_bridge/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:25520;
    }
}
