<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>凝心溯溪-临｜具身客户端快速绑定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <h1>具身客户端快速绑定</h1>
        <p>凝心溯溪-临 · 生成一次性配对码，在客户端菜单中完成绑定</p>
      </div>
      <div class="runtime-state" role="status" aria-live="polite" aria-atomic="true">
        <span class="state-dot" aria-hidden="true"></span>
        <span id="runtime-label">正在读取 Bridge 状态</span>
      </div>
    </header>

    <section class="workspace" aria-label="具身客户端后端配对">
      <form id="pairing-form" class="pairing-controls" autocomplete="off">
        <div>
          <span class="section-label">一次性连接</span>
          <h2>准备绑定 Quest</h2>
          <p id="form-hint">Bridge 正在检查服务端绑定配置。</p>
        </div>
        <button id="generate-button" class="primary" type="submit" aria-busy="false" disabled>
          生成绑定二维码
        </button>
      </form>

      <section class="pairing-panel" aria-labelledby="pairing-title">
        <div id="pairing-empty" class="empty-state">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm11 0h2v2h-2v-2Zm3 0h2v5h-2v-5Zm-4 4h3v2h-3v-2Z" /></svg>
          </div>
          <h2 id="pairing-title">等待生成配对码</h2>
          <p>二维码只携带一次性兑换凭证，不包含长期密钥。</p>
        </div>

        <div id="pairing-result" class="pairing-result" hidden>
          <div class="result-heading">
            <div>
              <h2>扫码绑定</h2>
              <p id="pairing-status" class="waiting" role="status" aria-live="polite" aria-atomic="true">等待 Quest 兑换</p>
            </div>
            <div class="countdown" aria-label="剩余时间">
              <span>剩余时间</span>
              <strong id="countdown">02:00</strong>
            </div>
          </div>

          <div class="qr-frame">
            <img id="qr-image" alt="Quest 一次性配对二维码" />
          </div>

          <div class="short-code-block">
            <span>6 位配对码</span>
            <strong id="short-code">—</strong>
            <p>当前相机 SDK 不支持应用内读取透视画面时，可在 Quest 配对面板中输入服务器地址和此短码。</p>
          </div>

          <div class="result-actions">
            <button id="copy-code" type="button" aria-busy="false">复制配对码</button>
            <button id="revoke" class="danger" type="button" aria-busy="false">撤销</button>
          </div>
        </div>
      </section>
    </section>

    <section class="security-strip" aria-label="配对安全与最近状态">
      <div class="security-copy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 5v5.4c0 4.8 3.2 9.3 7.5 10.6 4.3-1.3 7.5-5.8 7.5-10.6V5L12 2Zm0 4.1 4.5 1.8v2.5c0 3.2-1.8 6.3-4.5 7.6-2.7-1.3-4.5-4.4-4.5-7.6V7.9L12 6.1Z" /></svg>
        <div>
          <strong>二维码不包含长期密钥，兑换后立即失效</strong>
          <span>凭证仅保存在插件内存中；重载插件也会使其失效。</span>
        </div>
      </div>
      <div class="recent-binding">
        <span>最近一次绑定</span>
        <strong id="recent-binding">暂无</strong>
      </div>
    </section>

    <div id="startup-error" class="startup-error" role="alert" hidden></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
